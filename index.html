<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>핸든 시스템</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #0a0a0f;
      font-family: 'Noto Sans KR', sans-serif;
      color: #f0f0f0;
    }

    header {
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .header-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 40px 32px;
    }

    h1 {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 14px;
      color: rgba(255,255,255,0.55);
      font-weight: 300;
    }

    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 40px 80px;
    }

    .section-header {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.40);
      font-family: 'Space Grotesk', sans-serif;
    }

    .count-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 12px;
      color: rgba(255,255,255,0.55);
      font-family: 'Space Grotesk', sans-serif;
      margin-left: 12px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.03);
      text-decoration: none;
      display: block;
      color: inherit;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      border-color: rgba(255,255,255,0.12);
    }

    .card:active {
      transform: translateY(-1px);
    }

    .card-accent {
      height: 3px;
      width: 100%;
    }

    .card-body {
      padding: 24px;
      padding-bottom: 52px;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      margin-bottom: 16px;
      background: rgba(255,255,255,0.06);
    }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 12px;
      color: rgba(255,255,255,0.50);
      font-weight: 400;
    }

    .card-arrow {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      opacity: 0;
      transition: opacity 0.2s ease;
      color: rgba(255,255,255,0.6);
    }

    .card:hover .card-arrow {
      opacity: 1;
    }

    .back-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.7);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 13px;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 24px;
      transition: background 0.2s ease;
    }

    .back-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    @media (max-width: 600px) {
      .header-inner { padding: 32px 20px 24px; }
      main { padding: 28px 20px 60px; }
      .grid { grid-template-columns: 1fr; gap: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div style="display:flex; align-items:center; gap:20px;">
        <img src="logo.png" style="width:72px; height:72px; border-radius:16px; flex-shrink:0; object-fit:cover;" />
        <div>
          <h1 style="color:#ffffff;">韩敦系统</h1>
          <p class="subtitle">핸든 시스템 — AI 업무 솔루션</p>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 뷰 -->
  <main id="main-view">
    <div class="section-header">
      <div class="section-label">사이트 바로가기</div>
      <span class="count-badge" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <!-- 이벤트 뷰 -->
  <main id="event-view" style="display:none;">
    <button class="back-btn" onclick="goBack()">← 뒤로</button>
    <div class="section-header">
      <div class="section-label">이벤트</div>
      <span class="count-badge" id="event-count"></span>
    </div>
    <div class="grid" id="event-grid"></div>
  </main>

  <!-- 개발 중 뷰 -->
  <main id="dev-view" style="display:none;">
    <button class="back-btn" onclick="goBack()">← 뒤로</button>
    <div class="section-header">
      <div class="section-label">개발 중</div>
      <span class="count-badge" id="dev-count"></span>
    </div>
    <div class="grid" id="dev-grid"></div>
  </main>

  <script>
    const rainbow = ['#bd111d'];

    const sites = [
      {
        name: "데이세븐 판매량 집계",
        icon: "📊",
        description: "네이버 스마트 스토어",
        url: "https://crazywave3.github.io/day7_sales_summary/",
      },
      {
        name: "주문서 변환기",
        icon: "🔄",
        description: "주문 데이터 변환 도구",
        url: "https://crazywave3.github.io/day7_order_converter/",
      },
      {
        name: "HSK",
        icon: "📖",
        description: "你吃饭了吗？",
        url: "https://crazywave3.github.io/HSK_voca/",
      },
      {
        name: "수입 원가 계산기",
        icon: "🧮",
        description: "제품 1개당 원가 계산",
        url: "https://ibzandorcas.github.io/price-calc/",
      },
      {
        name: "품목코드 생성기",
        icon: "🏷️",
        description: "품목명·정식코드·약식코드 자동 생성",
        url: "https://ibzandorcas.github.io/product-code/",
      },
      {
        name: "데이세븐 자사몰",
        icon: "🏠",
        description: "WIX",
        url: "https://www.day-seven.com/",
      },
      {
        name: "핸든 제품 현황",
        icon: "📦",
        description: "제품 현황 대시보드",
        url: "https://crazywave3.github.io/hendon_product_status/",
      },
      {
        name: "광고 분석",
        icon: "📣",
        description: "네이버 쇼핑 광고 리포트",
        url: "https://crazywave3.github.io/NAVER_AD_report/",
      },
      {
        name: "이벤트",
        icon: "🎪",
        description: "행사 및 전시 바로가기",
        isFolder: true,
        folderKey: "event",
        accent: "#636366",
      },
      {
        name: "개발 중",
        icon: "🛠️",
        description: "준비 중인 서비스",
        isFolder: true,
        folderKey: "dev",
        accent: "#636366",
      },
    ];

    const events = [
      {
        name: "2026 서울국제식품산업대전",
        icon: "🍽️",
        description: "서울 식품 산업 전시회",
        url: "https://crazywave3.github.io/Seoulfood2026/",
      },
    ];

    const devSites = [
      {
        name: "주방용품 트렌드 조사",
        icon: "🔍",
        description: "개발 중",
        url: "https://crazywave3.github.io/Kitchenware-Trend-Research/",
      },
      {
        name: "교환 반품 관리",
        icon: "😂",
        description: "판매처 및 브랜드별 CS 상황",
        url: null,
      },
      {
        name: "핸든 매니지먼트",
        icon: "📡",
        description: "안전 재고 및 중국 발주서 관리",
        url: null,
      },
    ];

    function renderCards(data, containerId, useRainbow) {
      const grid = document.getElementById(containerId);
      grid.innerHTML = "";
      let ri = 0;
      data.forEach(site => {
        let accent;
        if (site.accent) {
          accent = site.accent;
        } else if (useRainbow) {
          accent = rainbow[ri % rainbow.length];
          ri++;
        } else {
          accent = "#636366";
        }

        const el = document.createElement(site.isFolder || site.url ? (site.isFolder ? "div" : "a") : "div");
        if (!site.isFolder && site.url) {
          el.href = site.url;
          el.target = "_blank";
          el.rel = "noopener noreferrer";
        }
        if (site.isFolder) {
          el.onclick = () => openFolder(site.folderKey);
        }
        el.className = "card";
        el.innerHTML = `
          <div class="card-accent" style="background:${accent}"></div>
          <div class="card-body">
            <div class="card-icon">${site.icon}</div>
            <div class="card-name">${site.name}</div>
            <div class="card-desc">${site.description}</div>
          </div>
          <div class="card-arrow">${site.isFolder ? "›" : "↗"}</div>
        `;
        grid.appendChild(el);
      });
    }

    function openFolder(key) {
      document.getElementById("main-view").style.display = "none";
      if (key === "event") {
        document.getElementById("event-view").style.display = "block";
        document.getElementById("event-count").textContent = events.length;
        renderCards(events, "event-grid", true);
      } else if (key === "dev") {
        document.getElementById("dev-view").style.display = "block";
        document.getElementById("dev-count").textContent = devSites.length;
        renderCards(devSites, "dev-grid", true);
      }
    }

    function goBack() {
      document.getElementById("event-view").style.display = "none";
      document.getElementById("dev-view").style.display = "none";
      document.getElementById("main-view").style.display = "block";
    }

    // 초기 렌더링
    document.getElementById("count").textContent = sites.length;
    renderCards(sites, "grid", true);
  </script>
</body>
</html>
